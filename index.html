<style>
:root{
  --bg:#000000; --panel:#141414; --panel2:#1f1f1f; --border:#2b2b2b;
  --text:#ffffff; --muted:#9a9a9a;
  --accent:#06C167; --accent-dark:#04a558; --accent-text:#06120c;
  --bad:#E11900; --warn:#FFC043;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
body{background:var(--bg);color:var(--text);font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;}
body.is-cashier .owner-only{display:none !important;}
header{position:sticky;top:0;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 12px;background:var(--panel);border-bottom:1px solid var(--border);z-index:10;display:flex;justify-content:space-between;align-items:center;}
header h1{margin:0;font-size:16px;letter-spacing:.3px;}
header h1 span{color:var(--accent);}
header .user{font-size:12px;color:var(--muted);text-align:right;}
header .user button{background:none;border:none;color:var(--accent);font-size:12px;cursor:pointer;padding:0;margin-top:2px;}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--border);position:sticky;top:56px;z-index:9;}
nav button{flex:0 0 auto;padding:8px 14px;border-radius:20px;border:1px solid var(--border);background:var(--panel2);color:var(--text);font-size:13px;cursor:pointer;}
nav button.active{background:var(--accent);border-color:var(--accent);color:var(--accent-text);font-weight:700;}
main{padding:14px 16px 100px;max-width:760px;margin:0 auto;}
.view{display:none;} .view.active{display:block;}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:14px;}
.card .label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;}
.card .value{font-size:21px;font-weight:800;margin-top:4px;}
.card .value.good{color:var(--accent);} .card .value.bad{color:var(--bad);}
h2.section{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin:20px 0 8px;}
.list-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);font-size:14px;}
.list-row:last-child{border-bottom:none;}
