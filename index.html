<script>
  var _bootErrors=[];
  function showBootError(m){
    var b=document.getElementById('login-error');
    if(b){ b.textContent='Error: '+m; } else { _bootErrors.push(m); }
    if(typeof toast==='function'){ try{ toast(m); }catch(_){} }
  }
  window.addEventListener('error',function(e){ showBootError(e.message||'Script error'); });
  window.addEventListener('unhandledrejection',function(e){ showBootError((e.reason&&e.reason.message)||String(e.reason)); });
  document.addEventListener('DOMContentLoaded',function(){ if(_bootErrors.length) showBootError(_bootErrors[0]); });
</script>

<style>
:root{
  --bg:#000000; --panel:#141414; --panel2:#1f1f1f; --border:#2b2b2b;
  --text:#ffffff; --muted:#9a9a9a;
  --accent:#06C167; --accent-dark:#04a558; --accent-text:#06120c;

*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
body{background:var(--bg);color:var(--text);font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;}

nav button{flex:0 0 auto;padding:8px 14px;border-radius:20px;border:1px solid var(--border);background:var(--panel2);color:var(--text);font-size:13px;cursor:pointer;}
